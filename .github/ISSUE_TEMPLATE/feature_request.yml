name: 功能建议
description: 提议一个用户价值明确的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 哪类用户在什么场景遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与边界
      description: 是否会影响商家、支付、食品安全、隐私或平台审核？
